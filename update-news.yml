name: 유나이티드제약 뉴스 클리핑 업데이트

on:
  schedule:
    # 00:00 UTC = 09:00 KST (한국은 UTC+9, 서머타임 없음)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (daily: 평소 증분 수집 / backfill: 최근 10년치 한 번에 수집)"
        type: choice
        default: daily
        options:
          - daily
          - backfill

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 뉴스 수집 스크립트 실행
        run: python fetch_news.py --mode ${{ github.event.inputs.mode || 'daily' }}

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add articles.json
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "chore: 뉴스 클리핑 자동 업데이트 $(date -u +%Y-%m-%d)"
            git push
          fi
